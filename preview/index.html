<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gesichtsmuskeln</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fbfbf9; font-family: system-ui, sans-serif; }
      body.dark { background: #0d1120; color: #e3dcff; }
      canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 520px; font-size: 12px; }
      #ui button { border: 1px solid #1a1f3333; background: #fff8; border-radius: 99px; padding: 4px 10px; cursor: pointer; }
      body.dark #ui button { background: #ffffff14; color: inherit; border-color: #ffffff33; }
      #ui button.on { background: #c2457a; color: #fff; }
      body.shot #ui { display: none; }
      #caption { position: fixed; z-index: 2; left: 0; right: 0; bottom: 28px; text-align: center; color: #1a1f33; font-size: 15px; line-height: 1.4; pointer-events: none; }
      #caption:empty { display: none; }
      #caption b { display: block; font-size: 22px; font-weight: 600; letter-spacing: 0.01em; margin-bottom: 4px; color: #c2457a; }
      #caption span { display: inline-block; max-width: 520px; padding: 0 16px; opacity: 0.75; }
      body.dark #caption { color: #e3dcff; }
      body.dark #caption b { color: #ffc2d6; }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
