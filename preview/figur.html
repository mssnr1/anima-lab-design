<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Geriggte Figur</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d1120; color: #e3dcff; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; }
      canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 8px; padding: 0 16px; }
      #ui button { font: inherit; font-size: 15px; border: 1px solid #ffffff33; background: #ffffff14; color: inherit; border-radius: 99px; padding: 10px 16px; cursor: pointer; }
      #ui button.on { background: #e3dcff; color: #0d1120; border-color: #e3dcff; }
      #hint { position: fixed; left: 0; right: 0; top: calc(16px + env(safe-area-inset-top)); text-align: center; font-size: 13px; opacity: 0.6; }
    </style>
  </head>
  <body>
    <div id="hint">Wischen zum Drehen</div>
    <div id="ui"></div>
    <script type="module" src="./figur.ts"></script>
  </body>
</html>
